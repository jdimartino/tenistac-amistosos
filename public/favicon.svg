<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pelota de tenis -->
  <circle cx="50" cy="50" r="45" fill="#C8D400" stroke="#A8B400" stroke-width="2"/>
  
  <!-- Líneas curvas características de la pelota de tenis -->
  <path d="M 20 50 Q 35 30, 50 50 T 80 50" 
        fill="none" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  <path d="M 20 50 Q 35 70, 50 50 T 80 50" 
        fill="none" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Sombra sutil para dar profundidad -->
  <circle cx="50" cy="50" r="45" fill="url(#shadow)" opacity="0.1"/>
  
  <defs>
    <radialGradient id="shadow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3"/>
    </radialGradient>
  </defs>
</svg>
