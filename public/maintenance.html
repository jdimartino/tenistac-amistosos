<!doctype html>
<!-- MAINTENANCE MODE — remove this file to revert (see firebase.json redirect) -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="robots" content="noindex" />
    <title>En mantenimiento</title>
    <style>
      :root {
        --court: #1f7a4d;
        --court-dark: #14523a;
        --line: #ffffff;
        --net: #0f172a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100dvh;
        overflow: hidden;
        background: var(--court-dark);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
        display: grid;
        place-items: center;
      }

      .court {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .court svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(6, 24, 18, 0.35) 0%,
            rgba(4, 16, 12, 0.78) 70%,
            rgba(2, 10, 7, 0.92) 100%
          );
      }

      .content {
        position: relative;
        z-index: 2;
        width: min(92vw, 680px);
        padding: 0 20px;
        text-align: center;
      }

      .ball {
        width: 78px;
        height: 78px;
        margin: 0 auto 28px;
        animation: bounce 1.5s cubic-bezier(0.3, 0, 0.4, 1) infinite;
        filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.45));
        transform-origin: center bottom;
      }

      .ball svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .ball-shadow {
        position: absolute;
        left: 50%;
        top: 118px;
        width: 66px;
        height: 14px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.5) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        animation: shadow 1.5s cubic-bezier(0.3, 0, 0.4, 1) infinite;
        z-index: 2;
      }

      .stage {
        position: relative;
        display: inline-block;
      }

      h1 {
        font-size: clamp(2.1rem, 9vw, 4.4rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        line-height: 1.02;
        text-transform: uppercase;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
      }

      p {
        margin-top: 18px;
        font-size: clamp(1rem, 4.2vw, 1.5rem);
        font-weight: 500;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) scaleY(1);
        }
        12% {
          transform: translateY(0) scaleY(1.06) scaleX(0.94);
        }
        45% {
          transform: translateY(-92px) scaleY(0.97) scaleX(1.03);
        }
        60% {
          transform: translateY(-96px) scaleY(1) scaleX(1);
        }
        88% {
          transform: translateY(0) scaleY(1.05) scaleX(0.95);
        }
      }

      @keyframes shadow {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translateX(-50%) scale(0.5);
          opacity: 0.22;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ball,
        .ball-shadow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top-down tennis court -->
    <div class="court" aria-hidden="true">
      <svg
        viewBox="0 0 1200 600"
        preserveAspectRatio="xMidYMid slice"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f7a4d" />
            <stop offset="1" stop-color="#14523a" />
          </linearGradient>
        </defs>

        <!-- Surround -->
        <rect width="1200" height="600" fill="#0e3f2c" />

        <!-- Playing surface -->
        <rect x="40" y="40" width="1120" height="520" fill="url(#surface)" />

        <!-- Doubles court -->
        <rect
          x="40"
          y="40"
          width="1120"
          height="520"
          fill="none"
          stroke="var(--line)"
          stroke-width="4"
        />

        <!-- Singles sidelines -->
        <line x1="40" y1="95" x2="1160" y2="95" stroke="var(--line)" stroke-width="4" />
        <line x1="40" y1="505" x2="1160" y2="505" stroke="var(--line)" stroke-width="4" />

        <!-- Service lines -->
        <line x1="370" y1="95" x2="370" y2="505" stroke="var(--line)" stroke-width="4" />
        <line x1="830" y1="95" x2="830" y2="505" stroke="var(--line)" stroke-width="4" />

        <!-- Center service line -->
        <line x1="370" y1="300" x2="830" y2="300" stroke="var(--line)" stroke-width="4" />

        <!-- Center marks -->
        <line x1="40" y1="300" x2="70" y2="300" stroke="var(--line)" stroke-width="4" />
        <line x1="1130" y1="300" x2="1160" y2="300" stroke="var(--line)" stroke-width="4" />

        <!-- Net band -->
        <rect x="592" y="28" width="16" height="544" fill="var(--net)" opacity="0.9" />
        <rect x="586" y="28" width="28" height="8" fill="var(--line)" />
        <rect x="586" y="564" width="28" height="8" fill="var(--line)" />
        <circle cx="600" cy="34" r="7" fill="var(--line)" />
        <circle cx="600" cy="566" r="7" fill="var(--line)" />
      </svg>
    </div>

    <div class="overlay" aria-hidden="true"></div>

    <main class="content">
      <div class="stage">
        <span class="ball-shadow" aria-hidden="true"></span>
        <div class="ball" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="ballGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0" stop-color="#e9ff6b" />
                <stop offset="55%" stop-color="#c6f000" />
                <stop offset="100%" stop-color="#9cc400" />
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#ballGrad)" />
            <path
              d="M14 22 C34 40 34 60 14 78"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linecap="round"
              opacity="0.9"
            />
            <path
              d="M86 22 C66 40 66 60 86 78"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linecap="round"
              opacity="0.9"
            />
          </svg>
        </div>
      </div>

      <h1>En mantenimiento</h1>
      <p>Estamos haciendo mejoras. Volvemos pronto 🎾</p>
    </main>
  </body>
</html>
